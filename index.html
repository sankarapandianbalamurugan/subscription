'use strict';
const KEY='subtrack-v1',PREF='subtrack-ui-v3';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});const pad=n=>String(n).padStart(2,'0');const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const now=()=>new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());const today=()=>iso(now());const parse=s=>{if(!s)return null;const [y,m,d]=s.split('-').map(Number);let x=new Date(y,m-1,d);return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d?x:null};const dateText=s=>parse(s)?.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})||'Not set';const days=s=>parse(s)?Math.round((parse(s)-now())/86400000):null;const categoryList=['All','Entertainment','Music','Productivity','AI Tools','Cloud Storage','Education','Health & Fitness','Shopping','Utilities','Other'];const frequency=['Weekly','Monthly','Quarterly','Yearly','Custom'];const multiplier=s=>s.frequency==='Weekly'?365.2425/7/12:s.frequency==='Biweekly'?365.2425/14/12:s.frequency==='Monthly'?1:s.frequency==='Semi-Yearly'?1/6:s.frequency==='Quarterly'?1/3:s.frequency==='Yearly'?1/12:s.frequency==='Custom'&&Number(s.customDays)>0?365.2425/(Number(s.customDays)*12):0;const monthly=s=>s.status==='Active'?Number(s.amount||0)*multiplier(s):0;const serviceData=[['Netflix','Entertainment','netflix'],['YouTube Premium','Entertainment','youtube'],['Spotify','Music','spotify'],['Amazon Prime','Shopping','amazonprime'],['Disney+','Entertainment','disneyplus'],['ChatGPT','AI Tools','openai'],['Apple Music','Music','applemusic'],['Google One','Cloud Storage','googleone'],['iCloud+','Cloud Storage','icloud'],['Microsoft 365','Productivity','microsoft365'],['Dropbox','Cloud Storage','dropbox'],['Adobe Creative Cloud','Productivity','adobe'],['1Password','Utilities','1password'],['Canva','Productivity','canva'],['Notion','Productivity','notion'],['Duolingo','Education','duolingo'],['Headspace','Health & Fitness','headspace'],['Strava','Health & Fitness','strava'],['Todoist','Productivity','todoist'],['Grammarly','Productivity','grammarly'],['JioHotstar','Entertainment','jio'],['YouTube Music','Music','youtube'],['Figma','Productivity','figma'],['Claude','AI Tools','anthropic'],['Perplexity','AI Tools','perplexity'],['GitHub','Productivity','github'],['Apple TV+','Entertainment','appletv'],['Google Workspace','Productivity','google'],['Audible','Education','audible'],['Coursera','Education','coursera']].map(([name,category,slug])=>({name,category,slug}));const sections={'Popular Subscriptions':['Netflix','YouTube Premium','Spotify','Amazon Prime','Disney+','ChatGPT','Apple Music','Google One'],'Essential Subscriptions':['iCloud+','Microsoft 365','Dropbox','Adobe Creative Cloud','1Password'],'App Subscriptions':['Canva','Notion','Duolingo','Headspace','Strava','Todoist','Grammarly','JioHotstar','Figma','Claude','Perplexity']};const catalogFor=name=>serviceData.find(s=>s.name.toLowerCase()===String(name).toLowerCase())||serviceData.find(s=>String(name).toLowerCase().startsWith(s.name.toLowerCase()+' '));const icon=(s,large=false)=>{let match=catalogFor(s.name),slug=s.logoSlug||match?.slug;return `<div class="brand" aria-hidden="true">${slug?`<img loading="lazy" alt="" src="https://cdn.simpleicons.org/${encodeURIComponent(slug)}" onerror="this.remove();this.parentNode.textContent='${esc((s.name||'?').charAt(0).toUpperCase())}'">`:esc((s.name||'?').charAt(0).toUpperCase())}</div>`};const makeDemo=()=>[['Netflix',649,'Monthly',3,'Active'],['Spotify',119,'Monthly',9,'Active'],['YouTube Premium',149,'Monthly',1,'Active'],['iCloud+',75,'Monthly',19,'Active'],['Adobe Creative Cloud',1499,'Yearly',45,'Active'],['Notion',0,'Monthly',5,'Trial']].map(([name,amount,frequency,offset,status],i)=>({id:'demo-'+i,name,category:catalogFor(name)?.category||'Other',logoSlug:catalogFor(name)?.slug,plan:'Personal',amount,frequency,status,startDate:today(),nextDate:iso(new Date(now().getTime()+offset*86400000)),currency:'INR',payment:'',reminder:true,reminderDays:3,notes:'',description:''}));let subs;try{let raw=localStorage.getItem(KEY);subs=raw===null?makeDemo():JSON.parse(raw);if(!Array.isArray(subs))throw Error()}catch{subs=makeDemo()}if(localStorage.getItem(KEY)===null)localStorage.setItem(KEY,JSON.stringify(subs));let pref={};try{pref=JSON.parse(localStorage.getItem(PREF)||'{}')}catch{}let page='Subscriptions',stack=[],selected=null,editId=null,query='',category='All',listQuery='',searchOpen=false,sort=pref.sort||'az',formDirty=false,formDraft=null;const save=()=>localStorage.setItem(KEY,JSON.stringify(subs));const toast=msg=>{ $('toast').innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').innerHTML='',2800)};const nav=()=>{let tabs=[['Upcoming','◷'],['Subscriptions','▤'],['Analytics','◉']];$('nav').style.display=tabs.some(x=>x[0]===page)?'flex':'none';$('nav').innerHTML=tabs.map(([name,i])=>`<button class="${page===name?'active':''}" data-nav="${name}"><span>${i}</span>${name}</button>`).join('')};const header=title=>`<header class="header"><div><div class="eyebrow">SUBTRACK</div><h1>${title}</h1></div><div class="header-actions"><button class="icon-btn primary" data-go="Discovery" aria-label="Add subscription">+</button><button class="icon-btn" data-go="Profile" aria-label="Profile and settings">♙</button></div></header>`;const pagehead=(title,extra='')=>`<div class="pagehead"><button class="back" data-back aria-label="Back">‹</button><h1>${esc(title)}</h1><div>${extra||'<span style="display:block;width:35px"></span>'}</div></div>`;const empty=(title,desc,action='',label='')=>`<div class="empty"><div class="symbol">✧</div><h3>${title}</h3><p>${desc}</p>${action?`<button class="btn" data-go="${action}">${label||'Add subscription'}</button>`:''}</div>`;const item=s=>`<div class="item" data-detail="${esc(s.id)}" tabindex="0" role="button" aria-label="View ${esc(s.name)}">${icon(s)}<div class="body"><strong>${esc(s.name)}</strong><div class="meta">${esc(s.plan||s.category||'Subscription')}</div><div class="meta">${esc(s.status||'Active')} · ${dateText(s.nextDate)}</div></div><div class="price">${money(s.amount)}<small>/${s.frequency==='Weekly'?'week':s.frequency==='Monthly'?'month':s.frequency==='Quarterly'?'quarter':s.frequency==='Yearly'?'year':(s.customDays||'?')+' days'}</small></div><button class="more" data-menu="${esc(s.id)}" aria-label="Actions for ${esc(s.name)}">⋮</button></div>`;const summaries=()=>{let m=subs.reduce((a,s)=>a+monthly(s),0);return `<div class="summary-grid"><div class="card summary"><div class="label">Monthly average</div><div class="number">${money(m)}</div><div class="suffix">/ month · active only</div></div><div class="card summary"><div class="label">Yearly estimate</div><div class="number">${money(m*12)}</div><div class="suffix">/ year · annualized</div></div></div>`};const subscriptions=()=>{let filtered=subs.filter(s=>s.name.toLowerCase().includes(listQuery.toLowerCase()));filtered.sort((a,b)=>sort==='az'?a.name.localeCompare(b.name):sort==='za'?b.name.localeCompare(a.name):sort==='low'?monthly(a)-monthly(b):monthly(b)-monthly(a));return `${header('Subscriptions')}${summaries()}<div class="section"><h2>All Subscriptions <span class="muted small">${subs.length}</span></h2><div class="header-actions"><button class="icon-btn" data-search-toggle aria-label="Search subscriptions">⌕</button><button class="icon-btn" data-sort aria-label="Sort subscriptions">⇅</button></div></div>${searchOpen?`<div class="searchline"><input id="list-search" class="field" placeholder="Search your subscriptions" value="${esc(listQuery)}" aria-label="Search your subscriptions"><button class="icon-btn" data-clear-search aria-label="Clear search">×</button></div>`:''}${filtered.length?filtered.map(item).join(''):empty(listQuery? document.addEventListener('input',e=>{if(e.target.id==='catalog-search'){let start=e.target.selectionStart;query=e.target.value;render();let input=$('catalog-search');input.focus();input.setSelectionRange(start,start)}if(e.target.id==='list-search'){let start=e.target.selectionStart;listQuery=e.target.value;render();let input=$('list-search');input.focus();input.setSelectionRange(start,start)}if(e.target.closest('#subform'))formDirty=true});document.addEventListener('change',async e=>{if(e.target.id==='f-frequency')$('custom-frequency').style.display=e.target.value==='Custom'?'block':'none';if(e.target.id==='import-file'){let file=e.target.files[0];if(!file)return;try{if(file.size>5e6)throw Error('File too large');let data=JSON.parse(await file.text()),arr=Array.isArray(data)?data:data.subscriptions;if(!Array.isArray(arr)||arr.length>10000||!arr.every(s=>s&&typeof s.id==='string'&&typeof s.name==='string'&&s.name.trim()&&Number.isFinite(Number(s.amount))&&Number(s.amount)>=0&&frequency.includes(s.frequency)&&['Active','Trial','Paused','Cancelled'].includes(s.status)))throw Error('Invalid backup');if(confirm(`Replace ${subs.length} subscriptions with ${arr.length} imported entries?`)){subs=arr;save();render();toast('Backup imported')}}catch(err){toast('Import failed: '+err.message)}}});document.addEventListener('submit',e=>{if(e.target.id!=='subform')return;e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f.entries()),valid=true;const error=(k,msg)=>{let node=$('err-'+k);if(node)node.textContent=msg;valid=false};['name','amount','startDate','nextDate'].forEach(k=>{if(!String(v[k]??'').trim())error(k,'This field is required')});if(v.amount!==''&&(!Number.isFinite(Number(v.amount))||Number(v.amount)<0))error('amount','Enter a valid non-negative price');if(!parse(v.startDate))error('startDate','Enter a valid date');if(!parse(v.nextDate))error('nextDate','Enter a valid date');if(parse(v.startDate)&&parse(v.nextDate)&&parse(v.nextDate)<parse(v.startDate))error('nextDate','Next billing cannot precede the start date');if(v.frequency==='Custom'&&(!Number.isInteger(Number(v.customDays))||Number(v.customDays)<1))error('customDays','Enter a valid number of days');if(v.reminderDays!==''&&(!Number.isInteger(Number(v.reminderDays))||Number(v.reminderDays)<0||Number(v.reminderDays)>365))error('reminderDays','Enter 0–365 days');if(!valid){toast('Please check the highlighted fields');return}let old=subs.find(s=>s.id===editId);let obj={...old,...formDraft,...v,id:editId||crypto.randomUUID(),name:v.name.trim(),amount:Number(v.amount),reminder:f.has('reminder'),reminderDays:Number(v.reminderDays||3),currency:'INR',logoSlug:catalogFor(v.name)?.slug||old?.logoSlug||formDraft?.logoSlug||''};if(editId)subs=subs.map(s=>s.id===editId?obj:s);else subs.push(obj);save();formDirty=false;selected=obj.id;page='Detail';stack=['Subscriptions'];render();scrollTo(0,0);toast(editId?'Subscription updated':'Subscription added')});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-detail],[data-service]')){e.preventDefault();e.target.click()}});render();
</script></body></html>
