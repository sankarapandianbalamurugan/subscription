<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171717"><title>SubTrack</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>

-shadow:0 12px 30px #0009}.menu button{display:block;width:100%;background:transparent;border:0;color:var(--text);text-align:left;padding:12px;border-radius:9px;font-size:12px}.menu button:hover{background:#494949}.menu .danger{color:var(--red)}.empty{padding:45px 24px;text-align:center;background:var(--surface);border-radius:22px}.empty .symbol{font-size:34px;color:var(--mint);margin-bottom:12px}.empty h3{font-size:17px;margin:0 0 8px}.empty p{color:var(--muted);line-height:1.7;margin:0 0 18px}.btn{background:var(--mint);border:0;color:#18261f;border-radius:15px;min-height:48px;padding:13px 20px;font-weight:800}.btn.secondary{background:var(--raised);color:var(--text)}.btn.danger{background:#4c2a2a;color:#ffc6c1}.btn.full{width:100%}.back{border:0;background:none;color:var(--text);font-size:24px;padding:6px 10px 6px 0}.pagehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.pagehead h1{font-size:19px;margin:0}.catalog-section{margin:24px 0}.catalog-section h2{font-size:16px}.catalog-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}.catalog-row .name{flex:1;font-weight:700}.catalog-row .arrow{font-size:21px;color:var(--muted)}.form-group{margin-bottom:17px}.form-group label{display:block;margin-bottom:8px;color:#dedede;font-size:12px;font-weight:700}.form-group .hint{color:var(--muted);font-size:11px;margin-top:5px}.error{color:var(--red);font-size:11px;margin-top:5px;min-height:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sticky-save{position:sticky;bottom:12px;background:linear-gradient(transparent,var(--bg) 25%);padding:18px 0 6px}.detail-logo{width:82px;height:82px;border-radius:23px;margin:auto;background:var(--raised);display:grid;place-items:center}.detail-logo .brand{width:72px;height:72px;font-size:29px}.detail-logo .brand img{width:49px;height:49px}.detail-title{text-align:center;margin:18px 0 24px}.detail-title h2{font-size:23px;margin:0 0 6px}.badge{display:inline-block;padding:5px 9px;background:#a9dfc11c;color:var(--mint);border-radius:50px;font-size:10px}.kv{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:12px}.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}.kv span:last-child{text-align:right;max-width:60%;overflow-wrap:anywhere}.bar{height:9px;background:#424242;border-radius:20px;overflow:hidden;margin-top:9px}.bar>div{height:100%;background:var(--mint);border-radius:20px}.analytics-row{margin:15px 0}.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}.timeline-title{color:var(--mint);font-size:12px;font-weight:800;margin:23px 0 11px}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:var(--mint);color:#13221a;padding:12px 20px;border-radius:12px;z-index:90;box-shadow:0 12px 35px #0008;white-space:nowrap;font-size:12px;font-weight:800}.sheet-shade{position:fixed;inset:0;background:#000a;z-index:40;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(100%,560px);background:#303030;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom))}.sheet button.option{display:flex;justify-content:space-between;width:100%;padding:15px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);text-align:left}.desktop-note{display:none}@media(min-width:800px){.shell{border-left:1px solid #303030;border-right:1px solid #303030}.desktop-note{display:block}}@media(max-width:355px){.item{gap:8px;padding:11px}.brand{width:39px;height:39px}.summary .number{font-size:20px}.form-grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:no-preference){button,.item{transition:background .18s,transform .18s}button:active{transform:scale(.97)}}

'use strict';
const KEY='subtrack-v1',PREF='subtrack-ui-v3';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});const pad=n=>String(n).padStart(2,'0');const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const now=()=>new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());const today=()=>iso(now());const parse=s=>{if(!s)return null;const [y,m,d]=s.split('-').map(Number);let x=new Date(y,m-1,d);return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d?x:null};const dateText=s=>parse(s)?.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})||'Not set';const days=s=>parse(s)?Math.round((parse(s)-now())/86400000):null;const categoryList=['All','Entertainment','Music','Productivity','AI Tools','Cloud Storage','Education','Health & Fitness','Shopping','Utilities','Other'];const frequency=['Weekly','Monthly','Quarterly','Yearly','Custom'];const multiplier=s=>s.frequency==='Weekly'?365.2425/7/12:s.frequency==='Monthly'?1:s.frequency==='Quarterly'?1/3:s.frequency==='Yearly'?1/12:s.frequency==='Custom'&&Number(s.customDays)>0?365.2425/(Number(s.customDays)*12):0;const monthly=s=>s.status==='Active'?Number(s.amount||0)*multiplier(s):0;const serviceData=[['Netflix','Entertainment','netflix'],['YouTube Premium','Entertainment','youtube'],['Spotify','Music','spotify'],['Amazon Prime','Shopping','amazonprime'],['Disney+','Entertainment','disneyplus'],['ChatGPT','AI Tools','openai'],['Apple Music','Music','applemusic'],['Google One','Cloud Storage','googleone'],['iCloud+','Cloud Storage','icloud'],['Microsoft 365','Productivity','microsoft365'],['Dropbox','Cloud Storage','dropbox'],['Adobe Creative Cloud','Productivity','adobe'],['1Password','Utilities','1password'],['Canva','Productivity','canva'],['Notion','Productivity','notion'],['Duolingo','Education','duolingo'],['Headspace','Health & Fitness','headspace'],['Strava','Health & Fitness','strava'],['Todoist','Productivity','todoist'],['Grammarly','Productivity','grammarly'],['JioHotstar','Entertainment','jio'],['YouTube Music','Music','youtube'],['Figma','Productivity','figma'],['Claude','AI Tools','anthropic'],['Perplexity','AI Tools','perplexity'],['GitHub','Productivity','github'],['Apple TV+','Entertainment','appletv'],['Google Workspace','Productivity','google'],['Audible','Education','audible'],['Coursera','Education','coursera']].map(([name,category,slug])=>({name,category,slug}));const sections={'Popular Subscriptions':['Netflix','YouTube Premium','Spotify','Amazon Prime','Disney+','ChatGPT','Apple Music','Google One'],'Essential Subscriptions':['iCloud+','Microsoft 365','Dropbox','Adobe Creative Cloud','1Password'],'App Subscriptions':['Canva','Notion','Duolingo','Headspace','Strava','Todoist','Grammarly','JioHotstar','Figma','Claude','Perplexity']};const catalogFor=name=>serviceData.find(s=>s.name.toLowerCase()===String(name).toLowerCase())||serviceData.find(s=>String(name).toLowerCase().startsWith(s.name.toLowerCase()+' '));const icon=(s,large=false)=>{let match=catalogFor(s.name),slug=s.logoSlug||match?.slug;return `<div class="brand" aria-hidden="true">${slug?`<img loading="lazy" alt="" src="https://cdn.simpleicons.org/${encodeURIComponent(slug)}" onerror="this.remove();this.parentNode.textContent='${esc((s.name||'?').charAt(0).toUpperCase())}'">`:esc((s.name||'?').charAt(0).toUpperCase())}</div>`};const makeDemo=()=>[['Netflix',649,'Monthly',3,'Active'],['Spotify',119,'Monthly',9,'Active'],['YouTube Premium',149,'Monthly',1,'Active'],['iCloud+',75,'Monthly',19,'Active'],['Adobe Creative Cloud',1499,'Yearly',45,'Active'],['Notion',0,'Monthly',5,'Trial']].map(([name,amount,frequency,offset,status],i)=>({id:'demo-'+i,name,category:catalogFor(name)?.category||'Other',logoSlug:catalogFor(name)?.slug,plan:'Personal',amount,frequency,status,startDate:today(),nextDate:iso(new Date(now().getTime()+offset*86400000)),currency:'INR',payment:'',reminder:true,reminderDays:3,notes:'',description:''}));let subs;try{let raw=localStorage.getItem(KEY);subs=raw===null?makeDemo():JSON.parse(raw);if(!Array.isArray(subs))throw Error()}catch{subs=makeDemo()}if(localStorage.getItem(KEY)===null)localStorage.setItem(KEY,JSON.stringify(subs));let pref={};try{pref=JSON.parse(localStorage.getItem(PREF)||'{}')}catch{}let page='Subscriptions',stack=[],selected=null,editId=null,query='',category='All',listQuery='',searchOpen=false,sort=pref.sort||'az',formDirty=false,formDraft=null;const save=()=>localStorage.setItem(KEY,JSON.stringify(subs));const toast=msg=>{ $('toast').innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').innerHTML='',2800)};const nav=()=>{let tabs=[['Upcoming','◷'],['Subscriptions','▤'],['Analytics','◉']];$('nav').style.display=tabs.some(x=>x[0]===page)?'flex':'none';$('nav').innerHTML=tabs.map(([name,i])=>`<button class="${page===name?'active':''}" data-nav="${name}"><span>${i}</span>${name}</button>`).join('')};const header=title=>`<header class="header"><div><div class="eyebrow">SUBTRACK</div><h1>${title}</h1></div><div class="header-actions"><button class="icon-btn primary" data-go="Discovery" aria-label="Add subscription">+</button><button class="icon-btn" data-go="Profile" aria-label="Profile and settings">♙</button></div></header>`;const pagehead=(title,extra='')=>`<div class="pagehead"><button class="back" data-back aria-label="Back">‹</button><h1>${esc(title)}</h1><div>${extra||'<span style="display:block;width:35px"></span>'}</div></div>`;const empty=(title,desc,action='',label='')=>`<div class="empty"><div class="symbol">✧</div><h3>${title}</h3><p>${desc}</p>${action?`<button class="btn" data-go="${action}">${label||'Add subscription'}</button>`:''}</div>`;const item=s=>`<div class="item" data-detail="${esc(s.id)}" tabindex="0" role="button" aria-label="View ${esc(s.name)}">${icon(s)}<div class="body"><strong>${esc(s.name)}</strong><div class="meta">${esc(s.plan||s.category||'Subscription')}</div><div class="meta">${esc(s.status||'Active')} · ${dateText(s.nextDate)}</div></div><div class="price">${money(s.amount)}<small>/${s.frequency==='Weekly'?'week':s.frequency==='Monthly'?'month':s.frequency==='Quarterly'?'quarter':s.frequency==='Yearly'?'year':(s.customDays||'?')+' days'}</small></div><button class="more" data-menu="${esc(s.id)}" aria-label="Actions for ${esc(s.name)}">⋮</button></div>`;const summaries=()=>{let m=subs.reduce((a,s)=>a+monthly(s),0);return `<div class="summary-grid"><div class="card summary"><div class="label">Monthly average</div><div class="number">${money(m)}</div><div class="suffix">/ month · active only</div></div><div class="card summary"><div class="label">Yearly estimate</div><div class="number">${money(m*12)}</div><div class="suffix">/ year · annualized</div></div></div>`};const subscriptions=()=>{let filtered=subs.filter(s=>s.name.toLowerCase().includes(listQuery.toLowerCase()));filtered.sort((a,b)=>sort==='az'?a.name.localeCompare(b.name):sort==='za'?b.name.localeCompare(a.name):sort==='low'?monthly(a)-monthly(b):monthly(b)-monthly(a));return `${header('Subscriptions')}${summaries()}<div class="section"><h2>All Subscriptions <span class="muted small">${subs.length}</span></h2><div class="header-actions"><button class="icon-btn" data-search-toggle aria-label="Search subscriptions">⌕</button><button class="icon-btn" data-sort aria-label="Sort subscriptions">⇅</button></div></div>${searchOpen?`<div class="searchline"><input id="list-search" class="field" placeholder="Search your subscriptions" value="${esc(listQuery)}" aria-label="Search your subscriptions"><button class="icon-btn" data-clear-search aria-label="Clear search">×</button></div>`:''}${filtered.length?filtered.map(item).join(''):empty(listQuery?'No matching subscriptions':'No subscriptions yet',listQuery?'Try another name or clear your search.':'Keep your recurring payments organized in one place.',listQuery?'':'Discovery',listQuery?'':'Add your first subscription')}`};const upcoming=()=>{let due=subs.filter(s=>['Active','Trial'].includes(s.status)&&parse(s.nextDate)).sort((a,b)=>parse(a.nextDate)-parse(b.nextDate));let next=due.find(s=>days(s.nextDate)>=0);let groups=[['Overdue',s=>days(s.nextDate)<0],['Today',s=>days(s.nextDate)===0],['Tomorrow',s=>days(s.nextDate)===1],['This Week',s=>days(s.nextDate)>=2&&days(s.nextDate)<=7],['Later',s=>days(s.nextDate)>7]];return `${header('Upcoming')}<div class="hero"><div class="eyebrow">UPCOMING PAYMENTS · NEXT 30 DAYS</div><div class="amount">${money(due.filter(s=>days(s.nextDate)>=0&&days(s.nextDate)<=30).reduce((a,s)=>a+Number(s.amount||0),0))}</div><div class="small muted">${due.filter(s=>days(s.nextDate)>=0&&days(s.nextDate)<=30).length} scheduled payments · actual amounts due</div><div class="kv"><span>Next payment</span><span>${next?`${esc(next.name)} · ${dateText(next.nextDate)}`:'None scheduled'}</span></div></div>${due.length?groups.map(([label,test])=>{let a=due.filter(test);return a.length?`<div class="timeline-title">${label} · ${a.length}</div>${a.map(item).join('')}`:''}).join(''):empty('No upcoming renewals','Active subscriptions and free trials with billing dates will appear here.','Discovery','Add subscription')}`};const analytics=()=>{let a=subs.filter(s=>s.status==='Active'),m=a.reduce((v,s)=>v+monthly(s),0),cats={};a.forEach(s=>cats[s.category||'Other']=(cats[s.category||'Other']||0)+monthly(s));let ranked=Object.entries(cats).sort((x,y)=>y[1]-x[1]);let top=[...a].sort((x,y)=>monthly(y)-monthly(x)).slice(0,5);let f={};a.forEach(s=>f[s.frequency]=(f[s.frequency]||0)+1);return `${header('Analytics')}${summaries()}<div class="section"><h2>Spending by category</h2></div>${ranked.length?`<div class="card">${ranked.map(([c,v])=>`<div class="analytics-row"><div class="row-between"><span>${esc(c)}</span><strong>${money(v)} <span class="muted small">${m?Math.round(v/m*100):0}%</span></strong></div><div class="bar"><div style="width:${m?v/m*100:0}%"></div></div></div>`).join('')}</div>`:empty('No analytics data','Add an active subscription to see your spending insights.','Discovery')}<div class="section"><h2>Most expensive</h2></div>${top.length?top.map(s=>`<div class="item" data-detail="${esc(s.id)}">${icon(s)}<div class="body"><strong>${esc(s.name)}</strong><div class="meta">Monthly equivalent</div></div><div class="price">${money(monthly(s))}<small>/month</small></div></div>`).join(''):empty('No active subscriptions','Activate a subscription to see cost rankings.')}<div class="section"><h2>Billing frequency</h2></div><div class="card">${Object.keys(f).length?Object.entries(f).map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><strong>${v} subscriptions</strong></div>`).join(''):'<span class="muted">No billing frequencies to show.</span>'}</div><p class="small muted">These are normalized spending estimates, not historical transactions. Payment history is not tracked yet.</p>`};const catalogRow=s=>`<div class="catalog-row" data-service="${esc(s.name)}" role="button" tabindex="0">${icon(s)}<div class="name">${esc(s.name)}</div><span class="arrow">›</span></div>`;const discovery=()=>{let q=query.toLowerCase().trim(),matched=serviceData.filter(s=>(category==='All'||s.category===category)&&(!q||`${s.name} ${s.category} ${s.slug}`.toLowerCase().includes(q)));let sectionHtml=q||category!=='All'?`<div class="section"><h2>Matching services <span class="muted small">${matched.length}</span></h2></div>${matched.map(catalogRow).join('')}`:Object.entries(sections).map(([title,names])=>`<div class="catalog-section"><div class="section"><h2>${title}</h2></div>${names.map(name=>serviceData.find(s=>s.name===name)).filter(Boolean).map(catalogRow).join('')}</div>`).join('');return `${pagehead('Add Subscription')}<div class="searchline"><input class="field" id="catalog-search" placeholder="Search subscriptions or services" value="${esc(query)}" aria-label="Search subscription catalog"></div><div class="chips">${categoryList.map(c=>`<button class="chip ${category===c?'selected':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>${matched.length?sectionHtml:empty('No services found','Try a different search or add a custom subscription.')}<div style="margin:22px 0 10px"><button class="btn secondary full" data-custom>＋ Add custom subscription</button></div>`};const detail=()=>{let s=subs.find(x=>x.id===selected);if(!s)return empty('Subscription not found','It may have been deleted.');return `${pagehead('Subscription Details',`<button class="icon-btn" data-menu="${esc(s.id)}">⋮</button>`)}<div class="detail-logo">${icon(s,true)}</div><div class="detail-title"><h2>${esc(s.name)}</h2><div class="muted small">${esc(s.plan||s.category)}</div><p><span class="badge">${esc(s.status)}</span></p></div><div class="hero"><div class="eyebrow">SUBSCRIPTION AMOUNT</div><div class="amount">${money(s.amount)}</div><div class="small muted">Billed ${esc(s.frequency.toLowerCase())}${s.frequency==='Custom'?' · every '+(s.customDays||'?')+' days':''}</div><div class="kv"><span>Next billing date</span><strong>${dateText(s.nextDate)}</strong></div></div><div class="section"><h2>Spending equivalent</h2></div><div class="summary-grid"><div class="card summary"><div class="label">Monthly</div><div class="number">${money(Number(s.amount||0)*multiplier(s))}</div></div><div class="card summary"><div class="label">Yearly</div><div class="number">${money(Number(s.amount||0)*multiplier(s)*12)}</div></div></div><div class="section"><h2>Subscription information</h2></div><div class="card">${[['Category',s.category],['Plan',s.plan||'Not specified'],['Start date',dateText(s.startDate)],['Next billing',dateText(s.nextDate)],['Payment method',s.payment||'Not specified'],['Reminder',s.reminder===false?'Off':`${s.reminderDays??3} days before`],['Status',s.status],...(s.accessEnd?[['Access ends',dateText(s.accessEnd)]]:[]),...(s.notes||s.description?[['Notes',s.notes||s.description]]:[])].map(([a,b])=>`<div class="kv"><span>${esc(a)}</span><span>${esc(b)}</span></div>`).join('')}</div><div class="section"><h2>Manage subscription</h2></div><button class="btn full" data-edit="${esc(s.id)}">Edit subscription</button><div style="height:10px"></div><button class="btn secondary full" data-status="${esc(s.id)}">${s.status==='Paused'?'Resume tracking':'Pause tracking'}</button><div style="height:10px"></div><button class="btn danger full" data-delete="${esc(s.id)}">Delete subscription</button><p class="muted small">Changes here only affect SubTrack tracking, not billing with the provider.</p>`};
const form=()=>{let s=editId?subs.find(x=>x.id===editId):formDraft||{};if(!s)s={};let input=(label,key,type='text',required=false)=>`<div class="form-group"><label for="f-${key}">${label}${required?' *':''}</label><input class="field" id="f-${key}" name="${key}" type="${type}" ${type==='number'?'min="0" step="0.01"':''} value="${esc(s[key]??'')}" ${required?'required':''}><div class="error" id="err-${key}"></div></div>`;let select=(label,key,opts)=>`<div class="form-group"><label for="f-${key}">${label}</label><select class="field" name="${key}" id="f-${key}">${opts.map(o=>`<option ${String(s[key]||'')===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;return `${pagehead(editId?'Edit Subscription':'Subscription Details')}<form id="subform" novalidate><div class="row-between card" style="margin-bottom:22px">${icon(s)}<div style="flex:1"><strong>${esc(s.name||'Custom subscription')}</strong><div class="muted small">${esc(s.category||'Choose a category')}</div></div></div>${input('Subscription name','name','text',true)}${input('Plan name','plan')}${select('Category','category',categoryList.slice(1))}<div class="form-grid">${input('Price (₹)','amount','number',true)}${select('Currency','currency',['INR'])}</div>${select('Billing frequency','frequency',frequency)}<div id="custom-frequency" style="display:${s.frequency==='Custom'?'block':'none'}">${input('Custom cycle (days)','customDays','number')}</div><div class="form-grid">${input('Start date','startDate','date',true)}${input('Next billing date','nextDate','date',true)}</div>${input('Payment method','payment')}${select('Status','status',['Active','Trial','Paused','Cancelled'])}<div class="form-group"><label><input type="checkbox" name="reminder" ${s.reminder!==false?'checked':''}> Renewal reminder enabled</label></div>${input('Remind days before renewal','reminderDays','number')}<div class="form-group"><label for="f-notes">Notes</label><textarea class="field" name="notes" id="f-notes" rows="3">${esc(s.notes||s.description||'')}</textarea></div><div class="sticky-save"><button class="btn full" type="submit">${editId?'Save changes':'Save Subscription'}</button></div></form>`};const profile=()=>`${pagehead('Profile & Settings')}<div class="card"><h2 style="margin-top:0">Your data stays on this device</h2><p class="muted small">SubTrack stores your subscriptions in this browser. No bank credentials or account connection is required.</p></div><div class="section"><h2>Backup and restore</h2></div><button class="btn full" data-export>Export JSON backup</button><div style="height:10px"></div><label class="btn secondary full" style="display:block;text-align:center;cursor:pointer">Import JSON backup<input type="file" id="import-file" accept=".json,application/json" hidden></label><div class="section"><h2>Data management</h2></div><button class="btn secondary full" data-demo>Restore sample subscriptions</button><div style="height:10px"></div><button class="btn danger full" data-clear>Delete all subscriptions</button><p class="small muted">Local reminders are informational only. Browser push notifications are not enabled in this version.</p>`;
const render=()=>{nav();$('app').innerHTML=page==='Subscriptions'?subscriptions():page==='Upcoming'?upcoming():page==='Analytics'?analytics():page==='Discovery'?discovery():page==='Detail'?detail():page==='Form'?form():profile();document.title='SubTrack · '+page;};const go=(p)=>{if(page==='Form'&&formDirty&&!confirm('Discard unsaved changes?'))return false;stack.push(page);page=p;formDirty=false;render();window.scrollTo(0,0);return true};const back=()=>{if(page==='Form'&&formDirty&&!confirm('Discard unsaved changes?'))return;page=stack.pop()||'Subscriptions';formDirty=false;render();window.scrollTo(0,0)};const serviceSelect=name=>{let s=catalogFor(name);formDraft={name,category:s?.category||'Other',logoSlug:s?.slug||'',amount:'',currency:'INR',frequency:'Monthly',status:'Active',startDate:today(),nextDate:today(),reminder:true,reminderDays:3,plan:'',notes:'',payment:''};editId=null;go('Form')};const edit=id=>{editId=id;formDraft=null;go('Form')};const changeStatus=id=>{let s=subs.find(x=>x.id===id);if(!s)return;let next=s.status==='Paused'?'Active':'Paused';if(confirm(`${next==='Paused'?'Pause':'Resume'} tracking for ${s.name}?\n\nThis will not change billing with the provider.`)){s.status=next;save();render();toast('Tracking status updated')}};const del=id=>{let s=subs.find(x=>x.id===id);if(!s)return;if(confirm(`Delete ${s.name}?\n\nThis cannot be undone and does not cancel billing with the provider.`)){subs=subs.filter(x=>x.id!==id);save();if(page==='Detail')page='Subscriptions';render();toast('Subscription deleted')}};const showMenu=id=>{let s=subs.find(x=>x.id===id);if(!s)return;let sh=$('sheet');sh.innerHTML=`<div class="sheet-shade" data-dismiss><div class="sheet"><div class="row-between"><strong>${esc(s.name)}</strong><button class="icon-btn" data-dismiss>×</button></div><button class="option" data-menu-action="view">View details <span>›</span></button><button class="option" data-menu-action="edit">Edit subscription <span>›</span></button><button class="option" data-menu-action="status">${s.status==='Paused'?'Resume':'Pause'} tracking <span>›</span></button><button class="option" data-menu-action="cancel">Mark as cancelled <span>›</span></button><button class="option" data-menu-action="delete" style="color:var(--red)">Delete subscription <span>›</span></button></div></div>`;sh.dataset.id=id};const showSort=()=>{$('sheet').innerHTML=`<div class="sheet-shade" data-dismiss><div class="sheet"><h2>Sort by</h2>${[['az','Name (A–Z)'],['za','Name (Z–A)'],['low','Price (Low to High)'],['high','Price (High to Low)']].map(([v,t])=>`<button class="option" data-sort-value="${v}">${t}<span>${sort===v?'✓':''}</span></button>`).join('')}</div></div>`};const closeSheet=()=>$('sheet').innerHTML='';
document.addEventListener('click',e=>{let t=e.target.closest('button,[data-detail],[data-service],[data-dismiss],[data-custom]');if(!t)return;let d=t.dataset;if(d.dismiss!==undefined&&(!e.target.closest('.sheet')||t.hasAttribute('data-dismiss')&&t.tagName==='BUTTON'))return closeSheet();if(d.nav){page=d.nav;stack=[];render();scrollTo(0,0)}else if(d.go)go(d.go);else if(d.back!==undefined)back();else if(d.detail){selected=d.detail;go('Detail')}else if(d.menu){e.stopPropagation();showMenu(d.menu)}else if(d.service)serviceSelect(d.service);else if(d.custom!==undefined)serviceSelect('');else if(d.cat){category=d.cat;render()}else if(d.searchToggle!==undefined){searchOpen=!searchOpen;render();if(searchOpen)$('list-search')?.focus()}else if(d.clearSearch!==undefined){listQuery='';render()}else if(d.sort!==undefined)showSort();else if(d.sortValue){sort=d.sortValue;pref.sort=sort;localStorage.setItem(PREF,JSON.stringify(pref));closeSheet();render()}else if(d.menuAction){let id=$('sheet').dataset.id;closeSheet();if(d.menuAction==='view'){selected=id;go('Detail')}if(d.menuAction==='edit')edit(id);if(d.menuAction==='status')changeStatus(id);if(d.menuAction==='delete')del(id);if(d.menuAction==='cancel'){let s=subs.find(x=>x.id===id);if(s&&confirm('Mark as cancelled? This does not cancel billing with the provider.')){s.status='Cancelled';save();render();toast('Marked as cancelled')}}}else if(d.edit)edit(d.edit);else if(d.status)changeStatus(d.status);else if(d.delete)del(d.delete);else if(d.export!==undefined){let blob=new Blob([JSON.stringify({app:'SubTrack',subscriptions:subs,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='subtrack-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}else if(d.demo!==undefined){if(confirm('Replace current subscriptions with demo data?')){subs=makeDemo();save();toast('Demo restored');render()}}else if(d.clear!==undefined){if(confirm('Delete all locally stored subscriptions?')){subs=[];save();render();toast('All subscriptions deleted')}}});
document.addEventListener('input',e=>{if(e.target.id==='catalog-search'){let start=e.target.selectionStart;query=e.target.value;render();let input=$('catalog-search');input.focus();input.setSelectionRange(start,start)}if(e.target.id==='list-search'){let start=e.target.selectionStart;listQuery=e.target.value;render();let input=$('list-search');input.focus();input.setSelectionRange(start,start)}if(e.target.closest('#subform'))formDirty=true});document.addEventListener('change',async e=>{if(e.target.id==='f-frequency')$('custom-frequency').style.display=e.target.value==='Custom'?'block':'none';if(e.target.id==='import-file'){let file=e.target.files[0];if(!file)return;try{if(file.size>5e6)throw Error('File too large');let data=JSON.parse(await file.text()),arr=Array.isArray(data)?data:data.subscriptions;if(!Array.isArray(arr)||arr.length>10000||!arr.every(s=>s&&typeof s.id==='string'&&typeof s.name==='string'&&s.name.trim()&&Number.isFinite(Number(s.amount))&&Number(s.amount)>=0&&frequency.includes(s.frequency)&&['Active','Trial','Paused','Cancelled'].includes(s.status)))throw Error('Invalid backup');if(confirm(`Replace ${subs.length} subscriptions with ${arr.length} imported entries?`)){subs=arr;save();render();toast('Backup imported')}}catch(err){toast('Import failed: '+err.message)}}});document.addEventListener('submit',e=>{if(e.target.id!=='subform')return;e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f.entries()),valid=true;const error=(k,msg)=>{let node=$('err-'+k);if(node)node.textContent=msg;valid=false};['name','amount','startDate','nextDate'].forEach(k=>{if(!String(v[k]??'').trim())error(k,'This field is required')});if(v.amount!==''&&(!Number.isFinite(Number(v.amount))||Number(v.amount)<0))error('amount','Enter a valid non-negative price');if(!parse(v.startDate))error('startDate','Enter a valid date');if(!parse(v.nextDate))error('nextDate','Enter a valid date');if(parse(v.startDate)&&parse(v.nextDate)&&parse(v.nextDate)<parse(v.startDate))error('nextDate','Next billing cannot precede the start date');if(v.frequency==='Custom'&&(!Number.isInteger(Number(v.customDays))||Number(v.customDays)<1))error('customDays','Enter a valid number of days');if(v.reminderDays!==''&&(!Number.isInteger(Number(v.reminderDays))||Number(v.reminderDays)<0||Number(v.reminderDays)>365))error('reminderDays','Enter 0–365 days');if(!valid){toast('Please check the highlighted fields');return}let old=subs.find(s=>s.id===editId);let obj={...old,...formDraft,...v,id:editId||crypto.randomUUID(),name:v.name.trim(),amount:Number(v.amount),reminder:f.has('reminder'),reminderDays:Number(v.reminderDays||3),currency:'INR',logoSlug:catalogFor(v.name)?.slug||old?.logoSlug||formDraft?.logoSlug||''};if(editId)subs=subs.map(s=>s.id===editId?obj:s);else subs.push(obj);save();formDirty=false;selected=obj.id;page='Detail';stack=['Subscriptions'];render();scrollTo(0,0);toast(editId?'Subscription updated':'Subscription added')});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-detail],[data-service]')){e.preventDefault();e.target.click()}});render();
