/* Add/Edit subscription readability improvements */
#subform .form-group label,
#subform label,
#subform .form-section { color:#292929 !important; }
#subform .form-group label { font-size:13px; font-weight:750; letter-spacing:.005em; line-height:1.45; margin-bottom:9px; }
#subform .form-section { font-weight:800; }
#subform .hint,
#subform .form-helper,
#subform .toggle-row p { color:#666461 !important; line-height:1.55; }
#subform .field,
#subform input,
#subform select,
#subform textarea { color:#292929 !important; -webkit-text-fill-color:#292929; }
#subform input::placeholder,
#subform textarea::placeholder { color:#777570 !important; opacity:1; }
#subform .error { color:#b72d23 !important; font-weight:650; }
#subform .form-group:focus-within label { color:#b94325 !important; }
#subform input:disabled,#subform select:disabled { opacity:.65; }

/* Centralized brand identity. Branded vector files are embedded for offline support. */
.brand{display:inline-flex;align-items:center;justify-content:center;flex:none;width:48px;height:48px;border-radius:15px;background:#f3f2f0;overflow:hidden;position:relative;color:var(--brand-color,#353535)}
.brand img{width:40px;height:40px;max-width:85%;max-height:85%;object-fit:contain;display:block}
.brand-initials{display:grid;place-items:center;width:100%;height:100%;font-size:15px;font-weight:800;color:var(--brand-color,#353535);background:#f1f0ed}
.brand--detail{width:76px;height:76px;border-radius:22px}.brand--detail img{width:64px;height:64px}.brand--detail .brand-initials{font-size:25px}
.detail-logo{width:76px;height:76px;background:transparent}.detail-logo .brand{width:76px;height:76px}.detail-logo .brand img{width:64px;height:64px}
.compact-service .brand,.form-service .brand{width:52px;height:52px;border-radius:16px}.compact-service .brand img,.form-service .brand img{width:44px;height:44px}
.catalog-row .brand{width:48px;height:48px}.item .brand{width:48px;height:48px}
@media(max-width:355px){.item .brand{width:44px;height:44px}}
.custom-logo-control{margin:12px 0 0;padding:13px 15px;border-radius:16px;background:#f4f3f1;color:#292929}
.custom-logo-control label{display:block;font-size:13px;font-weight:750;margin-bottom:6px}.custom-logo-control input{width:100%;font-size:12px;max-width:100%}.custom-logo-control p{margin:6px 0 0;font-size:11px;color:#666}

.brand .brand-initials{position:absolute;inset:0;z-index:0}.brand img{position:relative;z-index:1;background:#f3f2f0}.brand img:not([src]){display:none}
.brand--search{width:44px;height:44px}.brand--search img{width:36px;height:36px}
.brand--analytics{width:40px;height:40px}.brand--analytics img{width:32px;height:32px}
.analytics-item .brand{width:40px;height:40px}.analytics-item .brand img{width:32px;height:32px}

/* SubTrack layout & surface refinement — targeted fixes */
.pagehead{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;column-gap:12px;min-height:48px;margin-bottom:20px}
.pagehead .back{width:44px;height:44px;min-width:44px;display:grid;place-items:center;padding:0;margin:0;border:1px solid #eae9e7;border-radius:50%;background:#fff;color:#343131;box-shadow:0 1px 3px rgba(33,27,24,.035)}
.pagehead h1{min-width:0;margin:0;font-size:19px;line-height:1.25;text-align:left;overflow-wrap:anywhere}
.pagehead>div:last-child{width:44px;min-width:0;display:flex;align-items:center;justify-content:center}
.pagehead .back svg{width:20px;height:20px;display:block}
#subform .form-grid.compact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start;width:100%;min-width:0}
#subform .compact-grid>.form-group{min-width:0;width:100%;margin-bottom:12px}
#subform .compact-grid input[type=date],#subform .compact-grid .select-trigger{display:flex;align-items:center;justify-content:space-between;gap:6px;box-sizing:border-box;width:100%;max-width:100%;min-width:0;min-height:49px;overflow:hidden;font-size:13px}
#subform .compact-grid input[type=date]{padding:10px 7px;-webkit-appearance:none;appearance:none}
#subform .compact-grid input[type=date]::-webkit-date-and-time-value{min-width:0;text-align:left}
#subform .compact-grid .select-trigger>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#subform .compact-grid .select-trigger svg{flex-shrink:0}
#subform .simple-card,#subform .simple-section,#subform .form-group{min-width:0}
@media(max-width:420px){#subform .form-grid.compact-grid{grid-template-columns:minmax(0,1fr);gap:4px}#subform .compact-grid input[type=date]{padding:12px;font-size:14px}}
@media(max-width:350px){.pagehead{grid-template-columns:44px minmax(0,1fr) 44px;column-gap:8px}.pagehead h1{font-size:17px}}
.chip svg{display:inline-block;vertical-align:middle;margin-right:6px;flex:none}

const logoInitials=name=>{const words=String(name||'?').replace(/\+/g,'').trim().split(/\s+/);return words.length>1?words.slice(0,2).map(w=>w[0]).join('').toUpperCase():words[0].slice(0,2).toUpperCase()};
const detailTheme=s=>{const slug=catalogFor(s.name)?.slug||s.logoSlug||'';let c=s.customAccent||BRAND_COLORS[slug]||'#FF7048';return /^#[0-9a-fA-F]{6}$/.test(c)?c:'#FF7048'};
const SubscriptionLogo=(s,size='list')=>{
 const service=catalogFor(s.name),slug=service?.slug||s.logoSlug||'',url=BRAND_ASSETS[slug]||REMOTE_BRAND_ASSETS[slug]||'',color=BRAND_COLORS[slug]||'#575757';
 const initials=`<span class="brand-initials">${esc(logoInitials(s.name))}</span>`;
 const custom=s.customLogoId?`<img class="custom-brand-image" data-custom-logo="${esc(s.customLogoId)}" alt="" decoding="async">`:'';
 const image=url?`<img src="${esc(url)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`:'';
 return `<span class="brand brand--${size}" style="--brand-color:${color}" role="img" aria-label="${esc(s.name||'Custom')} logo">${initials}${custom||image}</span>`;
};
const logoDB=()=>new Promise((resolve,reject)=>{const req=indexedDB.open('subtrack-brand-images',1);req.onupgradeneeded=()=>req.result.createObjectStore('logos');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
const logoStore=async(id,blob)=>{const db=await logoDB();return new Promise((resolve,reject)=>{const tx=db.transaction('logos','readwrite');tx.objectStore('logos').put(blob,id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})};
