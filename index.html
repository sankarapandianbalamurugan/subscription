dding:13px 17px;font-weight:800;min-height:45px}.btn.secondary{background:#f0edff;color:var(--p)}.btn.danger{background:#fff0f2;color:var(--bad)}.btn.ghost{background:#f5f6fa;color:var(--ink)}.btn:disabled{opacity:.5;cursor:not-allowed}.controls{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}.search{width:100%;border:1px solid var(--line);padding:14px;border-radius:13px;background:white}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.chip{border:1px solid var(--line);background:white;color:var(--muted);padding:9px 15px;border-radius:100px;white-space:nowrap;font-weight:800}.chip.selected{background:var(--p);color:white;border-color:var(--p)}select,input,textarea{width:100%;background:#fff;border:1px solid #dde0eb;border-radius:11px;padding:12px;min-height:45px;color:var(--ink)}label{font-size:12px;font-weight:800;display:block;margin-bottom:7px}.field{margin-bottom:16px}.error{color:var(--bad);font-size:11px;min-height:14px;margin-top:3px}.form-grid{display:grid;grid-template-columns:1fr;gap:0 14px}.form-actions{display:flex;gap:10px;flex-wrap:wrap}.modal-back{position:fixed;inset:0;background:#19213a88;z-index:40;display:flex;align-items:flex-end;justify-content:center}.modal{background:white;border-radius:24px 24px 0 0;padding:24px;width:100%;max-height:94vh;overflow:auto}.modal h2{margin-bottom:20px}.modal-top{display:flex;justify-content:space-between;align-items:center}.icon-btn{background:#f4f5f9;border:0;border-radius:50%;width:38px;height:38px}.detail-row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.detail-row span{color:var(--muted)}.detail-row b{text-align:right}.bar-row{margin:17px 0}.bar-top{display:flex;justify-content:space-between;margin-bottom:8px;gap:8px}.bar{height:10px;border-radius:12px;background:#f0f0f6;overflow:hidden}.bar>div{height:100%;background:var(--p);border-radius:12px}.empty{text-align:center;padding:45px 18px}.empty-icon{font-size:38px;background:#f0edff;bor </style></head><body><div id="app" class="shell"></div><nav class="nav" id="nav"></nav><button class="fab" id="fab">＋ Add subscription</button><div id="overlay"></div><div id="toast" aria-live="polite"></div><script>
'use strict';const KEY='subtrack-v1',SETTINGS='subtrack-settings-v1';const categories=['Entertainment','Productivity','Music','Cloud Storage','Education','Fitness','Shopping','Utilities','Other'];const symbols={Entertainment:'▶',Productivity:'✦',Music:'♫','Cloud Storage':'☁',Education:'▤',Fitness:'♥',Shopping:'◈',Utilities:'⚙',Other:'★'};const frequencies={Weekly:7,Monthly:1,Quarterly:3,Yearly:12};const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const parse=s=>{if(!s)return null;let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const dayDiff=s=>Math.round((parse(s)-parse(today()))/86400000);const fmt=s=>s?parse(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'Not set';const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2,minimumFractionDigits:0});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const monthly=s=>s.status==='Cancelled'||s.status==='Paused'||s.status==='Trial'?0:Number(s.amount)*(s.frequency==='Weekly'?365.2425/7/12:12/frequencies[s.frequency]);const annual=s=>monthly(s)*12;const isDue=s=>['Active','Trial'].includes(s.status)&&s.nextDate;const active=s=>s.status==='Active';const demo=()=>{let a=[['Netflix','Entertainment',649,'Monthly',3,'Active'],['Spotify Premium','Music',119,'Monthly',9,'Active'],['YouTube Premium','Entertainment',149,'Monthly',1,'Active'],['iCloud+','Cloud Storage',75,'Monthly',19,'Active'],['Adobe Creative Cloud','Productivity',1499,'Yearly',45,'Active'],['Notion AI','Productivity',0,'Monthly',5,'Trial']];return a.map((x,i)=>({id:crypto.randomUUID(),name:x[0],category:x[1],amount:x[2],frequency:x[3],nextDate:iso(new Date(Date.now()+x[4]*86400000)),status:x[5],startDate:today(),plan:'Personal',description:'',currency:'INR',payment:'',reminder:true,reminderDays:3,accessEnd:''}))};let subs;try{let raw=localStorage.getItem(KEY);subs=raw===null?demo():JSON.parse(raw);if(!Array.isArray(subs))throw Error('Invalid data')}catch(e){subs=demo()}const save=()=>localStorage.setItem(KEY,JSON.stringify(subs));if(localStorage.getItem(KEY)===null)save();let page='Home',filter='All',sort='renewal',search='',detailId=null,formDirty=false,settings=JSON.parse(localStorage.getItem(SETTINGS)||'{}');const toast=msg=>{let el=document.getElementById('toast');el.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.innerHTML='',3500)};const el=id=>document.getElementById(id);const icon=cat=>symbols[cat]||'★';const statusClass=s=>s==='Free Trial'?'trial':s.toLowerCase();const displayStatus=s=>s==='Trial'?'Free Trial':s;const dateMsg=s=>{let d=dayDiff(s.nextDate);if(d<0)return `${Math.abs(d)}d overdue`;if(d===0)return 'Due today';if(d===1)return 'Tomorrow';return `In ${d} days`};const subscriptionRow=s=>`<div class="subscription" tabindex="0" role="button" data-open="${esc(s.id)}"><div class="service-icon">${icon(s.category)}</div><div class="service-body"><strong>${esc(s.name)}</strong><div class="subline">${esc(s.category)} · ${esc(s.frequency)} · ${fmt(s.nextDate)}</div><span class="pill ${statusClass(s.status)}">${displayStatus(s.status)}</span></div><div class="right"><strong>${money(s.amount)}</strong><div class="subline">${isDue(s)?dateMsg(s):s.status}</div></div></div>`;const empty=(title,desc,cta=false)=>`<div class="empty"><div class="empty-icon">◈</div><h2>${title}</h2><p>${desc}</p>${cta?'<button class="btn" data-add>Add your first subscription</button>':''}</div>`;const totals=()=>({m:subs.reduce((a,s)=>a+monthly(s),0),count:subs.filter(active).length,due:subs.filter(s=>isDue(s)&&dayDiff(s.nextDate)>=0&&dayDiff(s.nextDate)<=7).length});const home=()=>{let t=totals(),up=subs.filter(isDue).sort((a,b)=>dayDiff(a.nextDate)-dayDiff(b.nextDate)),upcoming=up.filter(s=>dayDiff(s.nextDate)>=0).slice(0,5),next=up.find(s=>dayDiff(s.nextDate)>=0);return `<div class="top"><div><div class="eyebrow">Your money, in focus</div><h1>Overview 👋</h1></div><div class="avatar">ST</div></div><div class="dashboard-grid"><div><div class="card hero"><div class="eyebrow">Monthly recurring spend</div><div class="money">${money(t.m)}</div><div style="opacity:.9;font-size:12px">Normalized monthly equivalent</div><div class="hero-foot"><div><span>Annual estimate</span><b>${money(t.m*12)}</b></div><div><span>Next renewal</span><b>${next?fmt(next.nextDate):'None'}</b></div></div></div><div class="stats"><div class="card"><div class="stat-label">Active subscriptions</div><div class="stat-value">${t.count}</div><div class="tiny muted">Paid & active</div></div><div class="card"><div class="stat-label">Due within 7 days</div><div class="stat-value">${t.due}</div><div class="tiny muted">Includes free trials</div></div></div></div><div><div class="section-head"><h2>Upcoming renewals</h2><button class="link" data-page="Subscriptions">View all →</button></div><div class="card">${upcoming.length?upcoming.map(subscriptionRow).join(''):empty('All caught up','No renewals coming up soon.')}</div><div class="insight"><span style="font-size:23px">✧</span><div><strong>Spending insight</strong><p>You’re tracking ${money(t.m*12)} in estimated annual recurring costs. Review unused subscriptions to save more.</p></div></div></div></div>${subs.length===0?`<div style="margin-top:20px">${empty('No subscriptions yet','Keep all your recurring payments organized in one place.',true)}</div>`:''}`};const list=()=>{let items=subs.filter(s=>(filter==='All'||s.status===filter)&&`${s.name} ${s.category} ${s.plan||''}`.toLowerCase().includes(search.toLowerCase()));items.sort((a,b)=>sort==='highest'?monthly(b)-monthly(a):sort==='lowest'?monthly(a)-monthly(b):sort==='alpha'?a.name.localeCompare(b.name):(dayDiff(a.nextDate||'9999-12-31')-dayDiff(b.nextDate||'9999-12-31')));return `<div class="top"><div><div class="eyebrow">Everything in one place</div><h1>Subscriptions</h1></div><div class="avatar">${subs.length}</div></div><input class="search" id="search" placeholder="Search subscriptions..." value="${esc(search)}" aria-label="Search subscriptions"><div class="controls"><div class="chips">${['All','Active','Trial','Paused','Cancelled'].map(f=>`<button class="chip ${filter===f?'selected':''}" data-filter="${f}">${f==='Trial'?'Free Trial':f}</button>`).join('')}</div><select id="sort" aria-label="Sort subscriptions"><option value="renewal" ${sort==='renewal'?'selected':''}>Next renewal</option><option value="highest" ${sort==='highest'?'selected':''}>Highest monthly cost</option><option value="lowest" ${sort==='lowest'?'selected':''}>Lowest monthly cost</option><option value="alpha" ${sort==='alpha'?'selected':''}>Name A–Z</option></select></div><div class="card">${items.length?items.map(subscriptionRow).join(''):empty(subs.length?'No matching subscriptions':'No subscriptions yet',subs.length?'Try another filter or search.':'Add your first subscription to get started.',!subs.length)}</div>`};const analytics=()=>{let t=totals(),cats={};subs.forEach(s=>cats[s.category]=(cats[s.category]||0)+monthly(s));let entries=Object.entries(cats).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),paid=subs.filter(s=>monthly(s)>0).sort((a,b)=>monthly(b)-monthly(a));let palette=['#6553ec','#9b8df9','#16b869','#f4a340','#e34c60','#4a9df8','#7d8496','#e8c96c'];let gradient=entries.length?`conic-gradient(${entries.map((x,i)=>{let start=entries.slice(0,i).reduce((a,y)=>a+y[1],0)/t.m*100,end=(start+x[1]/t.m*100);return `${palette[i%palette.length]} ${start}% ${end}%`}).join(',')})`:'#edeef5';return `<div class="top"><div><div class="eyebrow">Know where it goes</div><h1>Analytics</h1></div><div class="avatar">◉</div></div><div class="stats"><div class="card"><div class="stat-label">Monthly equivalent</div><div class="stat-value">${money(t.m)}</div></div><div class="card"><div class="stat-label">Yearly equivalent</div><div class="stat-value">${money(t.m*12)}</div></div><div class="card"><div class="stat-label">Active paid</div><div class="stat-value">${t.count}</div></div><div class="card"><div class="stat-label">Tracked subscriptions</div><div class="stat-value">${subs.length}</div></div></div>${!entries.length?`<div class="card">${empty('No analytics data','Add an active paid subscription to see your spending insights.',!subs.length)}</div>`:`<div class="two-col"><div class="card"><h2>Category breakdown</h2><div class="donut" style="background:${gradient}"><div class="donut-center"><div>${money(t.m)}<br><small>per month</small></div></div></div>${entries.map((x,i)=>`<div class="bar-row"><div class="bar-top"><span><span style="color:${palette[i%palette.length]}">●</span> ${esc(x[0])}</span><b>${money(x[1])} · ${(x[1]/t.m*100).toFixed(1)}%</b></div><div class="bar"><div style="width:${x[1]/t.m*100}%;background:${palette[i%palette.length]}"></div></div></div>`).join('')}</div><div class="card"><h2>Highest monthly costs</h2>${paid.slice(0,7).map(s=>`<div class="detail-row"><span>${esc(s.name)}</span><b>${money(monthly(s))}/mo</b></div>`).join('')}<p class="tiny muted">Savings opportunity: pausing or cancelling selected subscriptions reduces this estimated recurring total. This does not cancel billing with providers.</p></div></div>`}`};const settingsPage=()=>`<div class="top"><div><div class="eyebrow">Your preferences</div><h1>Settings</h1></div><div class="avatar">⚙</div></div><div class="card"><div class="settings-row"><h2>Privacy & storage</h2><p>All subscription data is saved only in this browser using LocalStorage. No account, bank access, or automatic subscription detection. Clearing browser data may erase it.</p></div><div class="settings-row"><h2>Export your data</h2><p>Download a JSON backup of your subscriptions.</p><button class="btn secondary" id="export">↓ Export JSO
