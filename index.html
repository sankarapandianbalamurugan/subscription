'use strict';const KEY='subtrack-v1',SETTINGS='subtrack-settings-v1';const categories=['Entertainment','Productivity','Music','Cloud Storage','Education','Fitness','Shopping','Utilities','Other'];const symbols={Entertainment:'▶',Productivity:'✦',Music:'♫','Cloud Storage':'☁',Education:'▤',Fitness:'♥',Shopping:'◈',Utilities:'⚙',Other:'★'};const frequencies={Weekly:7,Monthly:1,Quarterly:3,Yearly:12};const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const parse=s=>{if(!s)return null;let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const dayDiff=s=>Math.round((parse(s)-parse(today()))/86400000);const fmt=s=>s?parse(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'Not set';const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2,minimumFractionDigits:0});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const monthly=s=>s.status==='Cancelled'||s.status==='Paused'||s.status==='Trial'?0:Number(s.amount)*(s.frequency==='Weekly'?365.2425/7/12:12/frequencies[s.frequency]);const annual=s=>monthly(s)*12;const isDue=s=>['Active','Trial'].includes(s.status)&&s.nextDate;const active=s=>s.status==='Active';const demo=()=>{let a=[['Netflix','Entertainment',649,'Monthly',3,'Active'],['Spotify Premium','Music',119,'Monthly',9,'Active'],['YouTube Premium','Entertainment',149,'Monthly',1,'Active'],['iCloud+','Cloud Storage',75,'Monthly',19,'Active'],['Adobe Creative Cloud','Productivity',1499,'Yearly',45,'Active'],['Notion AI','Productivity',0,'Monthly',5,'Trial']];return a.map((x,i)=>({id:crypto.randomUUID(),name:x[0],category:x[1],amount:x[2],frequency:x[3],nextDate:iso(new Date(Date.now()+x[4]*86400000)),status:x[5],startDate:today(),plan:'Personal',description:'',currency:'INR',payment:'',reminder:true,reminderDays:3,accessEnd:''}))};let subs;try{let raw=localStorage.getItem(KEY);subs=raw===null?demo():JSON.parse(raw);if(!Array.isArray(subs))throw Error('Invalid data')}catch(e){subs=demo()}const save=()=>localStorage.setItem(KEY,JSON.stringify(subs));if(localStorage.getItem(KEY)===null)save();let page='Home',filter='All',sort='renewal',search='',detailId=null,formDirty=false,settings=JSON.parse(localStorage.getItem(SETTINGS)||'{}');const toast=msg=>{let el=document.getElementById('toast');el.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.innerHTML='',3500)};const el=id=>document.getElementById(id);const icon=cat=>symbols[cat]||'★';const statusClass=s=>s==='Free Trial'?'trial':s.toLowerCase();const displayStatus=s=>s==='Trial'?'Free Trial':s;const dateMsg=s=>{let d=dayDiff(s.nextDate);if(d<0)return `${Math.abs(d)}d overdue`;if(d===0)return 'Due today';if(d===1)return 'Tomorrow';return `In ${d} days`};const logoCatalog=[['YouTube Premium','youtube','#FF0033',['youtube premium','youtube music','youtube']],['Netflix','netflix','#E50914',['netflix']],['Spotify','spotify','#1DB954',['spotify']],['Amazon Prime','amazonprime','#00A8E1',['amazon prime','prime video','amazon video']],['Disney+','disneyplus','#113CCF',['disney+','disney plus','disney hotstar','hotstar']],['Apple Music','applemusic','#FA243C',['apple music']],['Apple TV+','appletv','#222222',['apple tv']],['iCloud','icloud','#3693F3',['icloud','icloud+']],['Adobe','adobe','#FF0000',['adobe','creative cloud']],['Notion','notion','#111111',['notion']],['ChatGPT','openai','#10A37F',['chatgpt','openai']],['Google One','googleone','#4285F4',['google one']],['Google Drive','googledrive','#4285F4',['google drive']],['Google Workspace','google','#4285F4',['google workspace','g suite']],['Microsoft 365','microsoft365','#D83B01',['microsoft 365','office 365']],['OneDrive','microsoftonedrive','#0078D4',['onedrive']],['Dropbox','dropbox','#0061FF',['dropbox']],['Canva','canva','#00C4CC',['canva']],['Figma','figma','#F24E1E',['figma']],['Framer','framer','#111111',['framer']],['Slack','slack','#4A154B',['slack']],['Zoom','zoom','#0B5CFF',['zoom']],['LinkedIn','linkedin','#0A66C2',['linkedin']],['GitHub','github','#181717',['github']],['GitHub Copilot','githubcopilot','#111111',['github copilot']],['Claude','anthropic','#D97757',['claude','anthropic']],['Perplexity','perplexity','#20808D',['perplexity']],['Grammarly','grammarly','#15C39A',['grammarly']],['Duolingo','duolingo','#58CC02',['duolingo']],['Coursera','coursera','#0056D2',['coursera']],['Udemy','udemy','#A435F0',['udemy']],['YouTube TV','youtube','#FF0033',['youtube tv']],['Twitch','twitch','#9146FF',['twitch']],['Crunchyroll','crunchyroll','#F47521',['crunchyroll']],['Hulu','hulu','#1CE783',['hulu']],['HBO Max','max','#111111',['hbo max','max']],['JioHotstar','jio','#0F3CC9',['jiohotstar','jio hotstar']],['JioCinema','jio','#0F3CC9',['jiocinema']],['JioSaavn','jiosaavn','#2BC5B4',['jiosaavn','saavn']],['ZEE5','zee5','#8230C6',['zee5']],['Sony LIV','sony','#111111',['sony liv','sonyliv']],['Airtel','airtel','#E40000',['airtel']],['Swiggy','swiggy','#FC8019',['swiggy']],['Zomato','zomato','#E23744',['zomato']],['Uber','uber','#111111',['uber']],['PlayStation Plus','playstation','#003791',['playstation','ps plus']],['Xbox Game Pass','xbox','#107C10',['xbox','game pass']],['Nintendo','nintendo','#E60012',['nintendo']],['Headspace','headspace','#F47C5A',['headspace']],['Strava','strava','#FC4C02',['strava']],['Fitbit','fitbit','#00B0B9',['fitbit']],['1Password','1password','#3B66BC',['1password']],['NordVPN','nordvpn','#4687FF',['nordvpn']],['ExpressVPN','expressvpn','#DA3940',['expressvpn']],['Todoist','todoist','#E44332',['todoist']],['Evernote','evernote','#00A82D',['evernote']],['Medium','medium','#111111',['medium']],['Substack','substack','#FF6719',['substack']],['Audible','audible','#F8991C',['audible']],['Kindle','amazonkindle','#FF9900',['kindle']],['Amazon Music','amazonmusic','#25D1DA',['amazon music']]];
const brandFor=name=>{let n=String(name||'').trim().toLowerCase();return logoCatalog.find(b=>b[3].some(a=>n===a||n.startsWith(a+' ')||n.startsWith(a+'+')))};
const serviceIcon=s=>{let b=brandFor(s.name);return b?`<div class="service-icon brand-icon" style="--brand:${b[2]}"><img src="https://cdn.simpleicons.org/${b[1]}/${b[2].slice(1)}" alt="" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span hidden>${esc((s.name||'?').slice(0,1).toUpperCase())}</span></div>`:`<div class="service-icon default-service-icon" aria-hidden="true">${icon(s.category)}</div>`};
const emptyArt=kind=>`<div class="empty-illustration" aria-hidden="true"><div class="empty-orbit"></div><div class="empty-main">${({subscription:'▤',renewal:'◷',analytics:'◉',search:'⌕',filter:'☷',active:'✓',trial:'◇',paused:'Ⅱ',cancelled:'×'})[kind]||'✦'}</div><div class="empty-spark">✦</div></div>`;
const subscriptionRow=s=>`<div class="subscription" tabindex="0" role="button" data-open="${esc(s.id)}" aria-label="View ${esc(s.name)} details">${serviceIcon(s)}<div class="service-body"><strong>${esc(s.name)}</strong><div class="subline">${esc(s.category)} · ${esc(s.frequency)} · ${fmt(s.nextDate)}</div><span class="pill ${statusClass(s.status)}">${displayStatus(s.status)}</span></div><div class="right"><strong>${money(s.amount)}</strong><div class="subline">${isDue(s)?dateMsg(s):s.status}</div><div class="quick-actions"><button type="button" class="quick-action" data-quick-edit="${esc(s.id)}" aria-label="Edit ${esc(s.name)}" title="Edit">✎</button><button type="button" class="quick-action delete-action" data-quick-delete="${esc(s.id)}" aria-label="Delete ${esc(s.name)}" title="Delete">♲</button></div></div></div>`;
const empty=(title,desc,cta=false,kind='subscription',label='Add subscription')=>`<div class="empty">${emptyArt(kind)}<h2>${title}</h2><p>${desc}</p>${cta?`<button class="btn empty-cta" data-add>＋ ${label}</button>`:''}</div>`;
const totals=()=>({m:subs.reduce((a,s)=>a+monthly(s),0),count:subs.filter(active).length,due:subs.filter(s=>isDue(s)&&dayDiff(s.nextDate)>=0&&dayDiff(s.nextDate)<=7).length});const home=()=>{let t=totals(),up=subs.filter(isDue).sort((a,b)=>dayDiff(a.nextDate)-dayDiff(b.nextDate)),upcoming=up.filter(s=>dayDiff(s.nextDate)>=0).slice(0,5),next=up.find(s=>dayDiff(s.nextDate)>=0);return `<div class="top"><div><div class="eyebrow">SUBTRACK · YOUR OVERVIEW</div><h1>Good to see you 👋</h1></div><div class="avatar">ST</div></div><div class="dashboard-grid"><div><div class="card hero"><div class="eyebrow">Monthly subscription spending</div><div class="money">${money(t.m)}</div><div style="opacity:.9;font-size:12px">Normalized monthly equivalent</div><div class="hero-foot"><div><span>Annual estimate</span><b>${money(t.m*12)}</b></div><div><span>Next renewal</span><b>${next?fmt(next.nextDate):'None'}</b></div></div></div><div class="quick-panel"><div class="quick-panel-title">Manage your subscriptions <span>↗</span></div><div class="quick-grid"><button data-add>＋<small>Add new</small></button><button data-page="Subscriptions">↗<small>Renewals</small></button><button data-trials>◷<small>Free trials</small></button><button data-page="Analytics">◉<small>Analytics</small></button></div></div><div class="stats"><div class="card"><div class="stat-label">Active subscriptions</div><div class="stat-value">${t.count}</div><div class="tiny muted">Paid & active</div></div><div class="card"><div class="stat-label">Due within 7 days</div><div class="stat-value">${t.due}</div><div class="tiny muted">Includes free trials</div></div></div></div><div><div class="section-head"><h2>Upcoming renewals</h2><button class="link" data-page="Subscriptions">View all →</button></div><div class="card">${upcoming.length?upcoming.map(subscriptionRow).join(''):empty('No upcoming renewals','Your upcoming payments will appear here as soon as they are scheduled.',false,'renewal')}</div><div class="card trend-card"><div class="section-head"><h2>Spending outlook</h2><span class="tiny muted">Monthly equivalent · current plans</span></div><div class="trend-visual"><svg viewBox="0 0 330 108" role="img" aria-label="Projected monthly equivalent spend based on current active plans" preserveAspectRatio="none"><defs><linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#A9DFC1" stop-opacity=".25"/><stop offset="1" stop-color="#A9DFC1" stop-opacity="0"/></linearGradient></defs><path d="M0 54 L66 54 L132 54 L198 54 L264 54 L330 54 L330 108 L0 108Z" fill="url(#trendFill)"/><path d="M0 54 L66 54 L132 54 L198 54 L264 54 L330 54" stroke="#A9DFC1" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="264" cy="54" r="5" fill="#A9DFC1"/></svg></div><div class="trend-labels"><span>Now</span><span>+1 mo</span><span>+2 mo</span><span>+3 mo</span><span>+4 mo</span><span>+5 mo</span></div><p class="tiny muted">Illustrative baseline, not historical payments. Your actual future charges may differ.</p></div><div class="insight"><span style="font-size:23px">✧</span><div><strong>Spending insight</strong><p>You’re tracking ${money(t.m*12)} in estimated annual recurring costs. Review unused subscriptions to save more.</p></div></div></div></div>${subs.length===0?`<div style="margin-top:20px">${empty('No subscriptions yet','Keep all your recurring payments organized in one place.',true,'subscription','Add your first subscription')}</div>`:''}`};const list=()=>{let items=subs.filter(s=>(filter==='All'||s.status===filter)&&`${s.name} ${s.category} ${s.plan||''}`.toLowerCase().includes(search.toLowerCase()));items.sort((a,b)=>sort==='highest'?monthly(b)-monthly(a):sort==='lowest'?monthly(a)-monthly(b):sort==='alpha'?a.name.localeCompare(b.name):(dayDiff(a.nextDate||'9999-12-31')-dayDiff(b.nextDate||'9999-12-31')));return `<div class="top"><div><div class="eyebrow">Everything in one place</div><h1>Subscriptions</h1></div><div class="avatar">${subs.length}</div></div><input class="search" id="search" placeholder="Search subscriptions..." value="${esc(search)}" aria-label="Search subscriptions"><div class="controls"><div class="chips">${['All','Active','Trial','Paused','Cancelled'].map(f=>`<button class="chip ${filter===f?'selected':''}" data-filter="${f}">${f==='Trial'?'Free Trial':f}</button>`).join('')}</div><select id="sort" aria-label="Sort subscriptions"><option value="renewal" ${sort==='renewal'?'selected':''}>Next renewal</option><option value="highest" ${sort==='highest'?'selected':''}>Highest monthly cost</option><option value="lowest" ${sort==='lowest'?'selected':''}>Lowest monthly cost</option><option value="alpha" ${sort==='alpha'?'selected':''}>Name A–Z</option></select></div><div class="card">${items.length?items.map(subscriptionRow).join(''):empty(!subs.length?'No subscriptions yet':search?'No search results':filter==='Active'?'No active subscriptions':filter==='Trial'?'No free trials':filter==='Paused'?'No paused subscriptions':filter==='Cancelled'?'No cancelled subscriptions':'No matching subscriptions',!subs.length?'Add your first subscription to start tracking renewals.':search?'Try a different service name or clear your search.':`There are no ${filter.toLowerCase()} subscriptions to show.`,!subs.length,search?'search':filter==='All'?'subscription':filter.toLowerCase(),'Add your first subscription')}</div>`};const analytics=()=>{let t=totals(),cats={};subs.forEach(s=>cats[s.category]=(cats[s.category]||0)+monthly(s));let entries=Object.entries(cats).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),paid=subs.filter(s=>monthly(s)>0).sort((a,b)=>monthly(b)-monthly(a));let palette=['#A9DFC1','#74BE9B','#F2C879','#8C9BD2','#F28B82','#7BBFC7','#D0A4C5','#A0A0A0'];let gradient=entries.length?`conic-gradient(${entries.map((x,i)=>{let start=entries.slice(0,i).reduce((a,y)=>a+y[1],0)/t.m*100,end=(start+x[1]/t.m*100);return `${palette[i%palette.length]} ${start}% ${end}%`}).join(',')})`:'#343434';return `<div class="top"><div><div class="eyebrow">Know where it goes</div><h1>Analytics</h1></div><div class="avatar">◉</div></div><div class="stats"><div class="card"><div class="stat-label">Monthly equivalent</div><div class="stat-value">${money(t.m)}</div></div><div class="card"><div class="stat-label">Yearly equivalent</div><div class="stat-value">${money(t.m*12)}</div></div><div class="card"><div class="stat-label">Active paid</div><div class="stat-value">${t.count}</div></div><div class="card"><div class="stat-label">Tracked subscriptions</div><div class="stat-value">${subs.length}</div></div></div>${!entries.length?`<div class="card">${empty('No spending data yet','Add an active paid subscription to unlock category insights and spending trends.',!subs.length,'analytics','Add subscription')}</div>`:`<div class="two-col"><div class="card"><h2>Category breakdown</h2><div class="donut" style="background:${gradient}"><div class="donut-center"><div>${money(t.m)}<br><small>per month</small></div></div></div>${entries.map((x,i)=>`<div class="bar-row"><div class="bar-top"><span><span style="color:${palette[i%palette.length]}">●</span> ${esc(x[0])}</span><b>${money(x[1])} · ${(x[1]/t.m*100).toFixed(1)}%</b></div><div class="bar"><div style="width:${x[1]/t.m*100}%;background:${palette[i%palette.length]}"></div></div></div>`).join('')}</div><div class="card"><h2>Highest monthly costs</h2>${paid.slice(0,7).map(s=>`<div class="detail-row"><span>${esc(s.name)}</span><b>${money(monthly(s))}/mo</b></div>`).join('')}<p class="tiny muted">Savings opportunity: pausing or cancelling selected subscriptions reduces this estimated recurring total. This does not cancel billing with providers.</p></div></div>`}`};const settingsPage=()=>`<div class="top"><div><div class="eyebrow">Your preferences</div><h1>Settings</h1></div><div class="avatar">⚙</div></div><div class="card"><div class="settings-row"><h2>Privacy & storage</h2><p>All subscription data is saved only in this browser using LocalStorage. No account, bank access, or automatic subscription detection. Clearing browser data may erase it.</p></div><div class="settings-row"><h2>Export your data</h2><p>Download a JSON backup of your subscriptions.</p><button class="btn secondary" id="export">↓ Export JSON</button></div><div class="settings-row"><h2>Import subscriptions</h2><p>Import a SubTrack JSON backup. Existing subscriptions will be replaced after confirmation.</p><label class="btn secondary" style="display:inline-block;cursor:pointer">↑ Choose JSON file<input id="import" type="file" accept="application/json,.json" style="display:none"></label></div><div class="settings-row"><h2>Demo data</h2><p>Replace current data with six sample subscriptions.</p><button class="btn secondary" id="demo">Restore demo subscriptions</button></div><div class="settings-row"><h2>Clear all subscriptions</h2><p>Remove every subscription from this device.</p><button class="btn danger" id="clear">Delete all data</button></div><div class="settings-row"><h2>Reminders</h2><p>In this browser-only version, reminders appear inside the app when opened. Background push notifications require a production app and permission.</p></div></div>`;const render=()=>{el('app').innerHTML=({Home:home,Subscriptions:list,Analytics:analytics,Settings:settingsPage}[page])();el('nav').innerHTML=['Home','Subscriptions','Analytics','Settings'].map((p,i)=>`<button data-page="${p}" class="${page===p?'active':''}" aria-label="${p}">${[['⌂','Home'],['▤','Subscriptions'],['◉','Analytics'],['⚙','Settings']][i][0]}<span>${p==='Settings'?'More':p}</span></button>`).join('');el('fab').classList.toggle('hide',!!detailId);bind();};const openDetail=id=>{detailId=id;let s=subs.find(x=>x.id===id);if(!s)return;el('overlay').innerHTML=`<div class="modal-back" id="back"><div class="modal" role="dialog" aria-modal="true" aria-label="Subscription details"><div class="modal-top"><div class="header-brand">${serviceIcon(s)}<div><h2 style="margin:0">${esc(s.name)}</h2><span class="pill ${statusClass(s.status)}">${displayStatus(s.status)}</span></div></div><button class="icon-btn" data-close aria-label="Close">✕</button></div><div style="margin:22px 0"><div class="eyebrow">Billing amount</div><div class="money" style="font-size:32px">${money(s.amount)} <span class="tiny muted">/ ${s.frequency.toLowerCase()}</span></div></div>${[['Category',s.category],['Plan',s.plan||'—'],['Description',s.description||'—'],['Monthly equivalent',money(monthly(s))],['Annual equivalent',money(annual(s))],['Start date',fmt(s.startDate)],['Next renewal',fmt(s.nextDate)],['Payment method',s.payment||'Not specified'],['Reminder',s.reminder?`${s.reminderDays} day(s) before`:'Off'],['Access ends',fmt(s.accessEnd)]].map(x=>`<div class="detail-row"><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('')}<p class="tiny muted">Payment history will be available in a future version.</p><div class="form-actions"><button class="btn" data-edit="${s.id}">Edit</button>${s.status==='Active'||s.status==='Trial'?`<button class="btn secondary" data-status="Paused">Pause tracking</button>`:s.status==='Paused'?`<button class="btn secondary" data-status="Active">Resume tracking</button>`:''}${s.status!=='Cancelled'?`<button class="btn ghost" data-status="Cancelled">Mark cancelled</button>`:''}<button class="btn danger" data-delete="${s.id}">Delete</button></div><p class="tiny muted">Changing status here does not change your subscription with the provider.</p></div></div>`;bindOverlay()};const closeOverlay=()=>{if(formDirty&&!confirm('Discard unsaved changes?'))return;formDirty=false;detailId=null;el('overlay').innerHTML='';el('fab').classList.remove('hide')};const openForm=(id=null)=>{let s=subs.find(x=>x.id===id)||{name:'',category:'',plan:'',description:'',amount:'',currency:'INR',frequency:'Monthly',startDate:today(),nextDate:today(),payment:'',reminder:true,reminderDays:3,status:'Active',accessEnd:''};formDirty=false;const field=(name,label,type='text',required=false,extra='')=>`<div class="field"><label for="f-${name}">${label}${required?' *':''}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(s[name])}" ${required?'required':''} ${extra}><div class="error" id="err-${name}"></div></div>`;const sel=(name,label,opts)=>`<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${opts.map(o=>`<option ${s[name]===o?'selected':''}>${esc(o)}</option>`).join('')}</select><div class="error" id="err-${name}"></div></div>`;el('overlay').innerHTML=`<div class="modal-back" id="back"><div class="modal" role="dialog" aria-modal="true" aria-label="${id?'Edit':'Add'} subscription"><div class="modal-top"><h2>${id?'Edit':'Add'} subscription</h2><button class="icon-btn" data-close aria-label="Close">✕</button></div><form id="subform" novalidate><div class="form-service-preview" id="service-preview"><span class="preview-symbol">✦</span><div><strong>Service details</strong><p class="tiny muted">Enter a popular service name to see its logo</p></div></div><h3>Basic information</h3><div class="form-grid">${field('name','Service name','text',true,'maxlength="80"')}<div class="field"><label for="f-category">Category *</label><select id="f-category" name="category" required><option value="">Select category</option>${categories.map(c=>`<option ${s.category===c?'selected':''}>${c}</option>`).join('')}</select><div class="error" id="err-category"></div></div>${field('plan','Plan name')}${field('description','Description')}</div><h3>Billing information</h3><div class="form-grid">${field('amount','Amount (₹)','number',true,'min="0" step="0.01"')}${sel('frequency','Billing frequency',Object.keys(frequencies))}${field('startDate','Start date','date',true)}${field('nextDate','Next billing / trial end date','date',true)}${field('payment','Payment method')}${sel('status','Status',['Active','Trial','Paused','Cancelled'])}${field('accessEnd','Access end date (optional)','date')}</div><h3>Reminders</h3><div class="field"><label class="toggle"><input type="checkbox" name="reminder" ${s.reminder?'checked':''}>Enable in-app reminders</label></div><div class="field"><label for="f-reminderDays">Remind days before renewal</label><input type="number" id="f-reminderDays" name="reminderDays" min="0" max="365" value="${esc(s.reminderDays)}"><div class="error" id="err-reminderDays"></div><div class="tiny muted">Common choices: 1, 3, 7 or 14 days; custom values supported.</div></div><div class="form-actions"><button class="btn" type="submit">${id?'Save changes':'Add subscription'}</button><button class="btn ghost" type="button" data-close>Cancel</button></div></form></div></div>`;el('subform').addEventListener('input',()=>{formDirty=true;const name=el('f-name').value;const preview=el('service-preview');if(preview){preview.querySelector('.preview-symbol').textContent=(name.trim()[0]||'✦').toUpperCase();preview.querySelector('strong').textContent=name.trim()||'Service details'}});el('subform').addEventListener('change',()=>formDirty=true);el('subform').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f.entries()),valid=true;['name','category','amount','startDate','nextDate','reminderDays'].forEach(k=>{let msg='';if(['name','category','amount','startDate','nextDate'].includes(k)&&!String(v[k]??'').trim())msg='This field is required';if(k==='amount'&&v[k]!==''&&(!Number.isFinite(Number(v[k]))||Number(v[k])<0))msg='Enter a valid amount of ₹0 or more';if(k==='reminderDays'&&(v[k]===''||!Number.isInteger(Number(v[k]))||Number(v[k])<0||Number(v[k])>365))msg='Enter 0–365 whole days';el('err-'+k).textContent=msg;if(msg)valid=false});if(v.startDate&&v.nextDate&&parse(v.nextDate)<parse(v.startDate)){el('err-nextDate').textContent='Billing date cannot precede start date';valid=false}if(v.accessEnd&&v.startDate&&parse(v.accessEnd)<parse(v.startDate)){el('err-nextDate').textContent='Access end cannot precede start date';valid=false}if(!valid){toast('Please fix the highlighted fields');return}v.amount=Number(v.amount);v.reminderDays=Number(v.reminderDays);v.reminder=!!f.get('reminder');v.currency='INR';v.id=id||crypto.randomUUID();if(id)subs=subs.map(x=>x.id===id?v:x);else subs.push(v);save();formDirty=false;detailId=null;el('overlay').innerHTML='';render();toast(id?'Subscription updated':'Subscription added')});bindOverlay()};const confirmDialog=(title,body,yes,action)=>{if(!confirm(`${title}\n\n${body}`))return;action();toast(yes)};const bindOverlay=()=>{el('overlay').onclick=e=>{let target=e.target;if(target.id==='back'||target.closest('[data-close]'))return closeOverlay();let edit=target.closest('[data-edit]');if(edit)return openForm(edit.dataset.edit);let del=target.closest('[data-delete]');if(del)return confirmDialog('Delete subscription?','This cannot be undone.','Subscription deleted',()=>{subs=subs.filter(s=>s.id!==del.dataset.delete);save();formDirty=false;detailId=null;el('overlay').innerHTML='';render()});let st=target.closest('[data-status]');if(st){let s=subs.find(x=>x.id===detailId),status=st.dataset.status;confirmDialog(`Change status to ${status}?`,status==='Cancelled'?'This only updates SubTrack. You must cancel directly with the provider to stop billing.':'This changes tracking inside SubTrack only.',`Status updated to ${status}`,()=>{s.status=status;save();el('overlay').innerHTML='';detailId=null;render()})}}};const quickDelete=id=>{let s=subs.find(x=>x.id===id);if(!s)return;confirmDialog(`Delete ${s.name}?`,'This permanently removes it from SubTrack. This does not cancel billing with the provider.','Subscription deleted',()=>{subs=subs.filter(x=>x.id!==id);save();render()})};const bind=()=>{document.querySelectorAll('[data-quick-edit]').forEach(x=>x.onclick=e=>{e.stopPropagation();openForm(x.dataset.quickEdit)});document.querySelectorAll('[data-quick-delete]').forEach(x=>x.onclick=e=>{e.stopPropagation();quickDelete(x.dataset.quickDelete)});document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>{page=x.dataset.page;render();scrollTo(0,0)});document.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>openForm());document.querySelectorAll('[data-open]').forEach(x=>{x.onclick=()=>openDetail(x.dataset.open);x.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(x.dataset.open)}}});document.querySelectorAll('[data-filter]').forEach(x=>x.onclick=()=>{filter=x.dataset.filter;render()});document.querySelectorAll('[data-trials]').forEach(x=>x.onclick=()=>{page='Subscriptions';filter='Trial';render();scrollTo(0,0)});if(el('search'))el('search').oninput=e=>{let pos=e.target.selectionStart;search=e.target.value;render();el('search').focus();el('search').setSelectionRange(pos,pos)};if(el('sort'))el('sort').onchange=e=>{sort=e.target.value;render()};if(el('export'))el('export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'SubTrack',version:1,exportedAt:new Date().toISOString(),subscriptions:subs},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='subtrack-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup downloaded')};if(el('import'))el('import').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>5e6)throw Error('File too large');let data=JSON.parse(await file.text()),arr=Array.isArray(data)?data:data.subscriptions;if(!Array.isArray(arr)||arr.length>10000||!arr.every(s=>s&&typeof s.id==='string'&&typeof s.name==='string'&&s.name.trim()&&categories.includes(s.category)&&Number.isFinite(s.amount)&&s.amount>=0&&frequencies[s.frequency]&&['Active','Trial','Paused','Cancelled'].includes(s.status)&&/^\d{4}-\d{2}-\d{2}$/.test(s.nextDate||'')&&/^\d{4}-\d{2}-\d{2}$/.test(s.startDate||'')))throw Error('Invalid SubTrack backup');if(confirm(`Replace ${subs.length} existing subscriptions with ${arr.length} imported subscriptions?`)){subs=arr;save();render();toast('Subscriptions imported')}}catch(err){toast('Import failed: '+err.message)}};if(el('demo'))el('demo').onclick=()=>confirmDialog('Restore demo subscriptions?','This replaces your current subscriptions.','Demo data restored',()=>{subs=demo();save();render()});if(el('clear'))el('clear').onclick=()=>confirmDialog('Delete all data?','All local subscriptions will be permanently removed. Export a backup first.','All subscriptions deleted',()=>{subs=[];save();render()})};el('fab').onclick=()=>openForm();document.addEventListener('keydown',e=>{if(e.key==='Escape'&&el('overlay').innerHTML)closeOverlay()});render();
